api:
  provider: ollama-local
  endpoint: http://127.0.0.1:11434/v1/chat/completions
  transport: OpenAI-compatible /v1/chat/completions through the ollama-unify negotiator proxy (the only
    proxied route; /api/chat and /api/generate hang). think:false is NOT honoured there; reasoning_effort
    is. Judged at low (bounded reasoning); if a call exhausts the budget with empty content, one fallback
    pass at none, recorded per judgment as usage.reasoning_mode. Rationale strings are capped at 800 chars
    via maxLength in the enforced schema; any finish=length falls through to the next mode.
  temperature: 0.0
  num_ctx: 32768
  num_predict: 3072
  seed: 1790783388
  timeout_seconds: 600
  max_attempts: 4
  retry_backoff_seconds:
  - 3
  - 10
  - 20
  - 40
  structured_outputs: response_format json_schema strict
  reasoning_effort: low
  reasoning_fallback: none
  rationale_max_chars: 800
judges:
  primary:
    provider: ollama-local
    model: manitcor/qwen3.8-27b-obliterated-e03:q6_k-corrected
    snapshot: manitcor/qwen3.8-27b-obliterated-e03:q6_k-corrected
  secondary:
