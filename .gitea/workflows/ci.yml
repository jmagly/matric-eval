# CI/CD Pipeline for matric-eval
# Runs tests, linting, and coverage checks on every push and PR
# Gitea release downloads are handled by release.yml; registry publishing is disabled.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_LOCKED: "1"
  UV_PYTHON: "3.11"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 10
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git make

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git remote set-url origin https://git.integrolabs.net/${{ github.repository }}.git

      - name: Install uv
        run: |
          python -m pip install uv==0.9.26

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --locked --extra dev

      - name: Verify CalVer surfaces
        run: python scripts/release_contract.py versions

      - name: Run lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make lint

      - name: Run format check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make format-check

      - name: Run type-check ratchet
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make type-check

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git make nodejs

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git remote set-url origin https://git.integrolabs.net/${{ github.repository }}.git

      - name: Install uv
        run: |
          python -m pip install uv==0.9.26

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --locked --extra dev --extra study

      - name: Run all tests with coverage
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make test-coverage-fail

      - name: Audit public benchmark sources
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run matric-eval audit-benchmarks --live --output-format json \
            --output benchmark-freshness.json

      - name: Retain benchmark freshness and client conformance reports
        if: always()
        # v3.2.2-node20 retains GHES/Gitea artifact backend compatibility.
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: benchmark-freshness
          path: |
            benchmark-freshness.json
            client-conformance-junit.xml

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 5
    needs: quality
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git remote set-url origin https://git.integrolabs.net/${{ github.repository }}.git

      - name: Install uv
        run: |
          python -m pip install uv==0.9.26

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --locked --extra dev --extra study

      - name: Verify installed CLI without model services
        run: |
          uv run matric-eval --version
          uv run matric-eval --help
          uv run matric-eval list-providers
          uv run matric-eval list-benchmarks

  build:
    name: Build Package
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 10
    needs: [test, smoke]
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git nodejs npm

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git remote set-url origin https://git.integrolabs.net/${{ github.repository }}.git

      - name: Install uv
        run: |
          python -m pip install uv==0.9.26

      - name: Verify release versions
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python scripts/release_contract.py versions

      - name: Build package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Verify package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ls -la dist/
          wheel=$(realpath dist/*.whl)
          cd /tmp
          uv run --isolated --no-project --with "$wheel" python -I -c "import matric_eval; print('Version:', matric_eval.__version__)"

      - name: Build and test TypeScript package
        working-directory: bindings/typescript
        run: |
          uv sync --locked --project ../..
          export MATRIC_EVAL_TEST_PYTHON="$(cd ../.. && pwd)/.venv/bin/python"
          npm ci
          npm run build
          npm test
          npm pack --dry-run
