# CI/CD Pipeline for matric-eval
# Runs tests, linting, and coverage checks on every push and PR
# Publishes packages on tagged releases

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 10
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git make

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev

      - name: Run lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make lint

      - name: Run format check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make format-check

      - name: Run type-check ratchet
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make type-check

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git make nodejs

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev

      - name: Run all tests with coverage
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make test-coverage-fail

      - name: Audit public benchmark sources
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run matric-eval audit-benchmarks --live --output-format json \
            --output benchmark-freshness.json

      - name: Retain benchmark freshness report
        if: always()
        # v3.2.2-node20 retains GHES/Gitea artifact backend compatibility.
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: benchmark-freshness
          path: benchmark-freshness.json

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 5
    needs: quality
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev

      - name: Run smoke tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest tests/unit/ \
            -v --tb=short \
            --maxfail=5 \
            -x

      - name: Verify CLI help
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python -m matric_eval.cli --help

  build:
    name: Build Package
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 10
    needs: [test, smoke]
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Verify package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ls -la dist/
          pip install dist/*.whl
          python -c "import matric_eval; print('Version:', matric_eval.__version__)"

  publish:
    name: Publish to Gitea
    runs-on: ubuntu-latest
    container: python:3.11
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Publish to Gitea PyPI
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pip install twine
          twine upload \
            --repository-url https://git.integrolabs.net/api/packages/roctinam/pypi \
            --username roctinam \
            --password "${GITEA_TOKEN}" \
            dist/*
