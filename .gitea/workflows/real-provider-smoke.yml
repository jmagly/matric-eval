name: Real Provider Smoke

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: real-provider-smoke
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  UV_PYTHON: "3.11"

jobs:
  smoke:
    name: Ollama CPU Smoke
    runs-on: [teroknor, docker, node-20]
    container: python:3.11
    timeout-minutes: 20
    services:
      ollama:
        image: ollama/ollama:0.32.0
        env:
          OLLAMA_KEEP_ALIVE: "0"
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y curl git nodejs

      - name: Checkout code
        run: |
          git init .
          git remote add origin \
            https://oauth2:${{ github.token }}@git.integrolabs.net/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout --detach FETCH_HEAD
          git remote set-url origin https://git.integrolabs.net/${{ github.repository }}.git

      - name: Install uv
        run: |
          python -m pip install uv==0.9.26

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --locked --extra dev

      - name: Run real-provider smoke
        env:
          MATRIC_SMOKE_ACCELERATOR: cpu
          MATRIC_SMOKE_RUNNER_NAME: teroknor
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python scripts/run_real_provider_smoke.py \
            --provider-url http://ollama:11434 \
            --model smollm2:135m \
            --benchmark matric_cli \
            --output artifacts/real-provider-smoke

      - name: Retain provider diagnostics
        if: always()
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: real-provider-smoke-${{ github.run_id }}
          path: artifacts/real-provider-smoke
          if-no-files-found: error
          retention-days: 14
