name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # =========================================================================
  # Tier 1: Unit CI — runs on every PR, no Docker required
  # =========================================================================
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit/ --cov=src/matric_eval --cov-fail-under=80 -q

      - name: Run top-level tests
        run: uv run pytest tests/ --ignore=tests/unit --ignore=tests/integration --ignore=tests/smoke -q

  # =========================================================================
  # Tier 2: Integration CI — triggered by path filters, requires Docker
  # =========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'sandbox/') ||
      contains(github.event.pull_request.changed_files, 'tasks/swebench/') ||
      contains(github.event.pull_request.changed_files, 'tasks/terminalbench') ||
      contains(github.event.pull_request.changed_files, 'tasks/claweval') ||
      contains(github.event.pull_request.changed_files, 'tasks/nl2repo')
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run pytest tests/integration/ -q --tb=short

  # =========================================================================
  # Tier 3: Nightly Smoke — full benchmark smoke tests against real models
  # =========================================================================
  nightly-smoke:
    name: Nightly Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run smoke tests
        run: uv run pytest tests/smoke/ -q --tb=short
        env:
          MATRIC_EVAL_PROVIDER: ollama
