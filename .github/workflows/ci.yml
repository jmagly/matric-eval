name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  # Use the container build: uv standalone Python may omit Linux pidfd APIs.
  UV_PYTHON: "/usr/local/bin/python"
  UV_LOCKED: "1"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    container: python:3.11
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git make nodejs npm

      - uses: actions/checkout@v4

      - name: Verify container Git workspace
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra study

      - name: Verify cleanup runtime capabilities
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import signal
          import sys
          assert sys.version_info[:2] == (3, 11), sys.version
          assert callable(getattr(os, "pidfd_open", None)), "Python lacks os.pidfd_open"
          assert callable(getattr(signal, "pidfd_send_signal", None)), "Python lacks signal.pidfd_send_signal"
          descriptor = os.pidfd_open(os.getpid())
          try:
              signal.pidfd_send_signal(descriptor, 0)
          finally:
              os.close(descriptor)
          print(sys.version, sys.executable, "pidfd cleanup available")
          PY

      - name: Verify CalVer surfaces
        run: python scripts/release_contract.py versions

      - name: Run lint
        run: make lint

      - name: Run format check
        run: make format-check

      - name: Run type-check ratchet
        run: make type-check

  # =========================================================================
  # Tier 1: Full test and coverage gate
  # =========================================================================
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    container: python:3.11
    needs: quality
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git make nodejs npm

      - uses: actions/checkout@v4

      - name: Verify container Git workspace
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra study

      - name: Verify cleanup runtime capabilities
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import signal
          import sys
          assert sys.version_info[:2] == (3, 11), sys.version
          assert callable(getattr(os, "pidfd_open", None)), "Python lacks os.pidfd_open"
          assert callable(getattr(signal, "pidfd_send_signal", None)), "Python lacks signal.pidfd_send_signal"
          descriptor = os.pidfd_open(os.getpid())
          try:
              signal.pidfd_send_signal(descriptor, 0)
          finally:
              os.close(descriptor)
          print(sys.version, sys.executable, "pidfd cleanup available")
          PY

      - name: Run all tests with coverage
        run: make test-coverage-fail

      - name: Audit public benchmark sources
        run: >-
          uv run matric-eval audit-benchmarks --live --output-format json
          --output benchmark-freshness.json

      - name: Retain benchmark freshness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-freshness
          path: |
            benchmark-freshness.json
            client-conformance-junit.xml

  build:
    name: Build Package
    runs-on: ubuntu-latest
    container: python:3.11
    needs: test
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git make nodejs npm

      - uses: actions/checkout@v4

      - name: Verify container Git workspace
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify cleanup runtime capabilities
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import signal
          import sys
          assert sys.version_info[:2] == (3, 11), sys.version
          assert callable(getattr(os, "pidfd_open", None)), "Python lacks os.pidfd_open"
          assert callable(getattr(signal, "pidfd_send_signal", None)), "Python lacks signal.pidfd_send_signal"
          descriptor = os.pidfd_open(os.getpid())
          try:
              signal.pidfd_send_signal(descriptor, 0)
          finally:
              os.close(descriptor)
          print(sys.version, sys.executable, "pidfd cleanup available")
          PY

      - name: Build package
        run: uv build

      - name: Verify wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import matric_eval; print(matric_eval.__version__)"

      - name: Build and test TypeScript package
        working-directory: bindings/typescript
        run: |
          npm ci
          npm run build
          npm test
          npm pack --dry-run
