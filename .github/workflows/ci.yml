name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run lint
        run: make lint

      - name: Run format check
        run: make format-check

      - name: Run type-check ratchet
        run: make type-check

  # =========================================================================
  # Tier 1: Full test and coverage gate
  # =========================================================================
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run all tests with coverage
        run: make test-coverage-fail

      - name: Audit public benchmark sources
        run: >-
          uv run matric-eval audit-benchmarks --live --output-format json
          --output benchmark-freshness.json

      - name: Retain benchmark freshness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-freshness
          path: benchmark-freshness.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build package
        run: uv build

      - name: Verify wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import matric_eval; print(matric_eval.__version__)"

  # =========================================================================
  # Tier 3: Nightly Smoke — full benchmark smoke tests against real models
  # =========================================================================
  nightly-smoke:
    name: Nightly Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run smoke tests
        run: uv run pytest tests/smoke/ -q --tb=short
        env:
          MATRIC_EVAL_PROVIDER: ollama
