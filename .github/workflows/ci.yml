name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  UV_PYTHON: "3.11"
  UV_LOCKED: "1"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra study

      - name: Verify CalVer surfaces
        run: python scripts/release_contract.py versions

      - name: Run lint
        run: make lint

      - name: Run format check
        run: make format-check

      - name: Run type-check ratchet
        run: make type-check

  # =========================================================================
  # Tier 1: Full test and coverage gate
  # =========================================================================
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra study

      - name: Run all tests with coverage
        run: make test-coverage-fail

      - name: Audit public benchmark sources
        run: >-
          uv run matric-eval audit-benchmarks --live --output-format json
          --output benchmark-freshness.json

      - name: Retain benchmark freshness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-freshness
          path: |
            benchmark-freshness.json
            client-conformance-junit.xml

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.9.26"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Build package
        run: uv build

      - name: Verify wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import matric_eval; print(matric_eval.__version__)"

      - name: Build and test TypeScript package
        working-directory: bindings/typescript
        run: |
          npm ci
          npm run build
          npm test
          npm pack --dry-run
