name: Real Provider Smoke

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: real-provider-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Ollama CPU Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      ollama:
        image: ollama/ollama:0.32.0
        ports:
          - 11434:11434
        env:
          OLLAMA_KEEP_ALIVE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run real-provider smoke
        env:
          MATRIC_SMOKE_ACCELERATOR: cpu
        run: >-
          uv run python scripts/run_real_provider_smoke.py
          --provider-url http://127.0.0.1:11434
          --model smollm2:135m
          --benchmark matric_cli
          --output artifacts/real-provider-smoke

      - name: Retain provider diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-provider-smoke-${{ github.run_id }}
          path: artifacts/real-provider-smoke
